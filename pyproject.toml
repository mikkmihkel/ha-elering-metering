[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-elering-metering"
version = "0.3.0"
description = "Home Assistant integration for Elering Estfeed metering data"
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[project.optional-dependencies]
# pytest-homeassistant-custom-component pins matching homeassistant, pytest and
# pytest-asyncio versions; pinning it keeps CI reproducible.
dev = [
  "pytest-homeassistant-custom-component==0.13.316",
  "aioresponses==0.7.9",
  "ruff==0.16.10",
  "mypy==2.4.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["custom_components/estfeed"]
plugins = []

[[tool.mypy.overrides]]
module = "homeassistant.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytest_homeassistant_custom_component.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"
