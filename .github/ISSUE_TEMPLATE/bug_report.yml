name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste your client secret.** Diagnostics downloaded from the integration page are redacted automatically; please still review them before attaching. Security issues: see SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Settings → System → Logs, filtered for "estfeed".
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → Elering Estfeed → ⋮ → Download diagnostics. Drag the file here.
